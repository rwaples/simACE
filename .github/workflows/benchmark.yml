name: Pipeline benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the locked pixi environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.0
          locked: true

      - name: Run the smoke benchmark
        run: >-
          pixi run python -m tools.benchmark run
          --profile smoke
          --out bench-logs/ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench-logs/ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
