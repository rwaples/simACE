[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "simace"
dynamic = ["version"]
description = "ACE pedigree simulation with A/C/E variance components"
requires-python = ">=3.13"
dependencies = [
    "pedigree-graph @ git+https://github.com/rwaples/pedigree-graph.git@v0.5.4",
    "numpy>=2.2,<3",
    "scipy>=1.14,<2",
    "polars>=1.43.2,<2",
    "pyarrow>=17,<26",
    "pyyaml>=6,<7",
    "numba>=0.60,<1",
]

# pandas is no longer a base dependency (ADR 0015): it survives only at the
# seaborn plot boundary, in the pandas-native tskit workflow scripts, and in
# cross-library compatibility tests — each declared in the extra that uses it.
[project.optional-dependencies]
plot = [
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "pillow>=10,<14",
    "pandas>=2.2,<4",
]
test = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
    "hypothesis>=6,<7",
    "pandas>=2.2,<4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
workflow = [
    "snakemake>=9,<10",
    "snakefmt>=2,<3",
    "pandas>=2.2,<4",
]
typecheck = ["ty==0.0.70"]
dev = [
    "simace[plot,test,docs,workflow,typecheck]",
]

[project.scripts]
simace-simulate = "simace.simulation.simulate:cli"
simace-phenotype = "simace.phenotype:cli"
simace-ascertain = "simace.ascertainment:cli"
simace-validate = "simace.analysis.validate:cli"
simace-phenotype-stats = "simace.analysis.stats:cli"
simace-analyze = "simace.analysis.analyze:cli"
simace-gather = "simace.analysis.gather:cli"
simace-plot-phenotype = "simace.plotting.plot_phenotype:cli"
simace-plot-validation = "simace.plotting.plot_validation:cli"
simace-parquet-to-tsv = "simace.core.parquet_to_tsv:cli"

[tool.setuptools.packages.find]
include = ["simace*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fitACE", ".git", ".snakemake", "external", "site", ".hypothesis"]
markers = [
    "slow: heavyweight tests (Monte Carlo, large pedigrees); deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py313"
required-version = ">=0.16,<0.17"
line-length = 120
extend-exclude = [".snakemake", "notes", "fitACE", "evaluate"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "A", "C4", "PT", "PIE", "PERF", "TC", "PLW", "RSE", "RET", "D"]
ignore = [
    "E501",   # line too long — formatter handles wrapping
    "SIM108", # use ternary — often less readable
    "RUF002", # ambiguous unicode in docstring — scientific notation (×)
    "RUF003", # ambiguous unicode in comment — scientific notation (×)
    "C408",   # unnecessary dict() call — dict() more readable in matplotlib bbox= kwargs
    "D105",   # undocumented magic method — not needed
    "D107",   # undocumented __init__ — args documented in class docstring
]

[tool.ruff.lint.per-file-ignores]
"workflow/scripts/**/*.py" = ["F821", "B018"]  # snakemake global injected at runtime; bare name check idiom
"tests/*.py" = ["B011", "RUF012", "D"]       # assert False; mutable class attrs OK in tests; no docstrings needed
"tests/**/*.py" = ["D"]                      # no docstrings needed in tests
"simace/__init__.py" = ["F401"]             # setup_logging used via re-export
"simace/core/_numba_utils.py" = ["D"]               # private module, all functions private
"simace/phenotype/models/*.py" = ["D102"]         # method docstrings inherited from PhenotypeModel ABC
"simace/plotting/atlas_manifest.py" = ["RUF001"]    # caption strings use scientific × − – etc.

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["simace"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.13"
# ty can't follow the import-hook editable install (__editable__*.pth + _finder.py)
# for pedigree_graph, so point it at the source checkout. Relies on the fixed
# family checkout layout (see CLAUDE.md repo map).
extra-paths = ["external/pedigree-graph"]

[tool.ty.src]
include = ["simace"]
exclude = ["tests", "workflow/scripts"]

[tool.ty.terminal]
error-on-warning = false
