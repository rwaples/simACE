# ============================================================
# ACE Simulation Validation Study — LTM arm
# Threshold-model counterpart to config/paper_simulation.yaml
# ============================================================
#
# Each scenario mirrors its frailty origin in paper_simulation.yaml
# but draws case status from the adult/LTM liability-threshold
# model at a true configured lifetime prevalence K. The CIF
# midpoint (cip_x0, years) and steepness (cip_k) set the onset-age
# profile; the frailty originals instead emit onset from a baseline
# hazard calibrated to the same prevalence-by-80.
#
# Paired design: each scenario reuses the SAME seed as its frailty
# origin, so the simulate stage draws an identical pedigree +
# liability and the two arms differ only in phenotype mechanism.
# Pedigree, N, generations, and the censoring schedule are copied
# verbatim from the origin.
#
# onset_adult has no LTM copy here: it is ALREADY adult/ltm in
# paper_simulation.yaml, so under the paired-seed design its copy
# would be byte-for-byte identical. It stands alone as the LTM
# reference; this file holds the 13 paired frailty -> LTM scenarios.
#
# Expected divergence (by design, not a bug): late-onset LTM copies
# (onset_late_ltm, stress_high_herit_late_rare_ltm) realize observed
# prevalence BELOW their configured K, because the CIF is not
# saturated by age 80 and competing death removes late cases. The
# K-vs-observed gap is a reported output of the comparison.
# ============================================================


# ══════════════════════════════════════════════════════════════
# 1. HERITABILITY SERIES
# ══════════════════════════════════════════════════════════════

herit_low_ltm:
  seed: 31000
  G_sim: 12
  G_ped: 10
  G_pheno: 10
  pedigree:
    trait1:
      A: 0.2
      C: 0.0
      E: 0.8
    trait2:
      A: 0.2
      C: 0.0
      E: 0.8
    rA: 0.3
    rC: 0.0
    rE: 0.0
  phenotype:
    trait1:
      model: adult
      params:
        method: ltm
        cip_x0: 50
        cip_k: 0.2
        prevalence: 0.10
      beta: 1.0
    trait2:
      model: adult
      params:
        method: ltm
        cip_x0: 50
        cip_k: 0.2
        prevalence: 0.20
      beta: 1.5
  censoring:
    max_age: 80
    gen_censoring:
      0: [0, 80]
      1: [0, 80]
      2: [0, 80]
      3: [0, 70]
      4: [0, 60]
      5: [0, 50]
      6: [0, 40]
      7: [0, 30]
      8: [0, 20]
      9: [0, 10]
    death_scale: 164
    death_rho: 2.73

