# multimight phase 1 validation (fitACE_epimight joint.py; plans/multimight-joint-ace-v2.md).
# Each cell mirrors epimight_ci_broad.yaml cib3_C01: N 50k, G_pheno 4, K 0.25, no MZ twins, random mating.
# rA/rC are 0: phase 1 fits trait1 only.

# C = 0: Falconer/follow-up leak into c2 (read first)
mm_C0:
  seed: 361000
  N: 50000
  G_sim: 10
  G_ped: 10
  G_pheno: 4
  replicates: 400
  standardize: none
  pedigree:
    p_mztwin: 0
    trait1:
      A: 0.5
      C: 0.0
      E: 0.5
      C_transmission:
        maternal: 0.0
        paternal: 0.0
    trait2:
      A: 0.5
      C: 0.0
      E: 0.5
      C_transmission:
        maternal: 0.0
        paternal: 0.0
    rA: 0.0
    rC: 0.0
  phenotype:
    trait1:
      model: adult
      params:
        method: ltm
        cip_x0: 50
        cip_k: 0.15
        prevalence: 0.25
      beta: 1.0
      beta_sex: 0.0
    trait2:
      model: adult
      params:
        method: ltm
        cip_x0: 20
        cip_k: 0.15
        prevalence: 0.25
      beta: 1.0
      beta_sex: 0.0
  censoring:
    gen_censoring: {6: [0, 80], 7: [0, 80], 8: [0, 80], 9: [0, 80]}
    death_scale: 164
    death_rho: 2.73

