# ── Sparse end of the num_causal sweep ──────────────────────────────────────
# Added for poster panel 10, which shows the parametric (infinitesimal) A
# converging on the gene-drop A as polygenicity rises. The sweep above cannot
# show that: it starts at 100 causal loci, which is already effectively
# infinitesimal for every statistic that discriminates the two models.
#
# The discriminating statistic is the Mendelian sampling deviation
# d = A_offspring - midparent A, which simACE's parametric path draws as
# Normal(0, A/2) independent of the parents. Its excess kurtosis falls as ~1/L.
# Over the 71,902 trios with a gene-drop A on both parent and offspring the
# measurement noise floor is sqrt(24/n) = 0.018, and the analytic departure is
# 0.050 at L=100, 0.016 at L=1000 and 0.0013 at L=10,000. Only L=100 clears the
# floor. Sampling the eligible pool predicts 0.74 at L=10, 0.43 at L=20, 0.21 at
# L=50 and 0.039 at L=300, so 10/30/300 plus the existing 100 give four points
# above the floor before the curve lands on it.
#
# L < 10 is deliberately excluded: across draws the interquartile range of the
# predicted kurtosis spans a factor of ~30, because one rare large-effect locus
# carries the whole trait. A single replicate there shows an accident, not a trend.
#
# All three reuse p2_full's dropped chromosomes via `drop_from`
# (workflow/rules/simace/tstrait_phenotype.smk:79), so only the tstrait steps run.
p2_full_c10:
  seed: 4242
  N: 35951
  G_ped: 10
  G_sim: 10
  G_pheno: 3
  replicates: 1
  use_gene_drop: true
  pedigree: *id003
  phenotype: *id004
  drop_from: p2_full
  tstrait:
    num_causal: 10
