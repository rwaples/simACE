# ── Below ten causal loci ───────────────────────────────────────────────────
# Added 2026-09-11 for the poster panel that plots the distribution of A against
# polygenicity. The sweep above bottoms out at 10, where the excess kurtosis of
# A is 0.55 against 0.02 for the drawn arm. That is a real departure but a small
# one to read off a printed density, and the panel is trying to show a reader
# where the infinitesimal shortcut starts to be wrong rather than to measure it.
#
# This walks back the "L < 10 is deliberately excluded" note above, which was
# written for a different figure. That note is still right about the statistics:
# with three causal loci one locus can carry most of the trait, so the realized
# kurtosis of a single draw is not an estimate of anything, and across draws it
# scatters by more than an order of magnitude. It is wrong as a reason to leave
# these out of a figure whose claim is about a single architecture and says so.
# Read these two arms as one architecture each, not as the sparse limit.
#
# Both reuse p2_full's dropped chromosomes via `drop_from`, so only the tstrait
# steps run: about 270 wall seconds each, from benchmarks/genotype_drop/p2_full_c10.
p2_full_c3:
  seed: 4242
  N: 35951
  G_ped: 10
  G_sim: 10
  G_pheno: 3
  replicates: 1
  use_gene_drop: true
  pedigree: *id003
  phenotype: *id004
  drop_from: p2_full
  tstrait:
    num_causal: 3
