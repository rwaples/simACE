# ── One-knob assortative-mating variant ─────────────────────────────────────
# bench1M with the panel 7 mating parameters and nothing else changed, to price
# the AM machinery. The values are `am_asym`'s (config/epimight_h2_bias.yaml:124):
# within-trait spousal r of 0.25 and 0.40, cross-trait 0.21. The matrix diagonal
# overrides the scalars (params.py:157), so all three are given and must agree.
#
# Nested blocks flatten to individual keys (simace/config.py:148), so this
# overrides three keys and inherits every other pedigree default from bench1M.
# That is the point: the delta against bench1M is the cost of AM alone.
#
# G_sim stays at 5, so there is no burn-in and the spousal correlation does not
# reach its target. That is deliberate for a timing comparison -- burn-in would
# price 12 extra generations of simulation, not the AM machinery. It also means
# this scenario's *statistics* are not equilibrated and should not be read.
#
# Deliberately kept out of the scaling figure: it sits at 1M alongside bench1M
# and both would draw as "1M". Run it into its own log directory:
#   pixi run python -m tools.benchmark run --folder bench_scale \
#     --scenarios bench1M bench1M_am
bench1M_am:
  seed: 60008
  N: 200000
  G_ped: 5
  G_sim: 5
  G_pheno: 5
  replicates: 1
  pedigree:
    assort1: 0.25
    assort2: 0.40
    assort_matrix: [[0.25, 0.21], [0.21, 0.40]]
  analysis:
    skip_ne_coancestry: true
