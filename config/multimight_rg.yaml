# multimight phase 2: joint rg (plans/multimight-rg.md, v2).
# Every cell is mm_C02 (config/multimight.yaml: N 50k, G_pheno 4, K .25, no MZ twins, random mating;
# trait 1 A .5 C .2 E .3) with rA, rC, trait 2's ACE (default A .4 C .3 E .3) and C transmission set
# per cell. Fit with MULTIMIGHT_BIVARIATE=1. Seeds 5000 apart from 520000, clear of the other
# multimight folders (401000-494999).

# per-type rg biased low; joint rg unbiased
rg_A5_C0:
  seed: 520000
  N: 50000
  G_sim: 10
  G_ped: 10
  G_pheno: 4
  replicates: 400
  standardize: none
  pedigree:
    p_mztwin: 0
    trait1:
      A: 0.5
      C: 0.2
      E: 0.3
      C_transmission: {maternal: 0.0, paternal: 0.0}
    trait2:
      A: 0.4
      C: 0.3
      E: 0.3
      C_transmission: {maternal: 0.0, paternal: 0.0}
    rA: 0.5
    rC: 0.0
  phenotype:
    trait1:
      model: adult
      params: {method: ltm, cip_x0: 50, cip_k: 0.15, prevalence: 0.25}
      beta: 1.0
      beta_sex: 0.0
    trait2:
      model: adult
      params: {method: ltm, cip_x0: 20, cip_k: 0.15, prevalence: 0.25}
      beta: 1.0
      beta_sex: 0.0
  censoring:
    gen_censoring:
      6: [0, 80]
      7: [0, 80]
      8: [0, 80]
      9: [0, 80]
    death_scale: 164
    death_rho: 2.73

