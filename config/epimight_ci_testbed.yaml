# citb_K25_full_g4 — the deep calibration cell locked in the 2026-09-02 grilling
# session (plans/sandwich-kinds-and-depth.md §0b, decision 3). Same K25 design, all
# G_sim=10 generations recorded (G_ped: 10), but FOUR generations phenotyped
# (G_pheno: 4 -> generations 6,7,8,9 = born_at_year 1966..1969).
#
# Why four and not three. A proband generation g can only have first cousins if
# generation g-2 is in the emitted frame, since cousinhood is established through the
# grandparents. At G_pheno=3 that holds for the last stratum only — measured on
# citb_K25_full rep1, the fraction of probands with zero 1C relatives is 100% in 1968
# and 7.2% in 1969 — so 1C collapses to a single estimable stratum. With G_pheno=4,
# born_at_year 1966 is dropped as the founder year, 1967 still lacks cousins (it would
# need generation 5), and *both* analysed strata 1968 and 1969 have complete cousin
# sets. All four relationship types are then analysed on the same two strata.
#
# gen_censoring keys are ABSOLUTE generations here (censor.py:118 matches
# `generations == int(gen)`), unlike the G_ped=3 cells where recording renumbers them
# to 0..2. citb_K25_full's {0,1,2} keys never match its phenotyped 7,8,9 and are inert
# — harmless only because censoring.max_age is already 80.
#
# replicates: the locked calibration run is R = 4000 (decision 5); 24 here is the
# throughput check that must land before that is committed.
citb_K25_full_g4:
  seed: 330000
  N: 200000
  G_sim: 10
  G_ped: 10
  G_pheno: 4
  replicates: 24
  pedigree:
    p_mztwin: 0
    trait1:
      A: 0.5
      C: 0.0
      E: 0.5
    trait2:
      A: 0.5
      C: 0.0
      E: 0.5
    rA: 0.3
    rC: 0.0
  phenotype:
    trait1:
      model: adult
      params:
        method: ltm
        cip_x0: 50
        cip_k: 0.15
        prevalence: 0.25
      beta: 1.0
      beta_sex: 0.0
    trait2:
      model: adult
      params:
        method: ltm
        cip_x0: 20
        cip_k: 0.15
        prevalence: 0.25
      beta: 1.0
      beta_sex: 0.0
  censoring:
    gen_censoring: {6: [0, 80], 7: [0, 80], 8: [0, 80], 9: [0, 80]}
    death_scale: 164
    death_rho: 2.73

