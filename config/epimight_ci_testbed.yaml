# citb_K25_cal_n50k — THE CALIBRATION CELL (plans/sandwich-kinds-and-depth.md §5f).
# The G_pheno=4 deep design at N=50k, R=4000, scored at max_degree=3.
#
# Why N=50k and not 200k: the 24-replicate throughput check measured the sandwich at
# 154 s/rep and 17.8 GB peak at degree 5 (one worker fits in 30 GB -> 195 h for R=4000),
# and 35.7 s/rep at degree 3 with N=200k (31.7 h). At N=50k degree 3 it is 8.3 s/rep and
# 1.2 GB (9.5 h). `scale` and coverage are RATIOS, so neither moves with N; degree 3 was
# shown adequate for all four relationship types (worst SE error 1.6%).
#
# Raw output is ~40 MB/rep = 160 GB at R=4000, so the driver cleans raw parquets per
# batch and keeps only the narrowed pedigree plus the per-pair-type sums.
citb_K25_cal_n50k:
  seed: 350000
  N: 50000
  G_sim: 10
  G_ped: 10
  G_pheno: 4
  replicates: 4000
  pedigree:
