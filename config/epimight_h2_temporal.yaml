# epimight_h2_temporal scenarios — cohort-varying h² mechanisms.
#
# Generated by scripts/_build_temporal_scenarios.py. **Do not hand-edit** the
# dense schedule dicts. Re-run the helper to regenerate.
#
# Generation-coordinate contract:
#   * E1/E2/C1/C2 dicts use **raw simulation iteration** keys (0..G_sim-1).
#     With G_sim=25 / G_ped=12 / G_pheno=10, phenotyped raw iters are 15..24.
#     resolve_per_gen_param requires a key ≤ 0 → each E dict includes
#     `0: <baseline>` plus the dense per-iter values.
#   * prevalence and blended_diagnosis.alpha_by_gen/K_by_gen use **output
#     generation** keys (0..G_ped-1, rebased). With G_pheno=10 these are 2..11.
#     prevalence_to_array requires an exact key for every observed gen, so the
#     dicts enumerate all 10 phenotyped output gens explicitly.
#
# See notes/heritability/epimight_h2_temporal.md for the design rationale.


prevalence_rising:
  # LaBianca-style lowering-threshold (constant ACE, K rises 2% → 12%
  # across output gens 2..11). Per-gen prevalence dict enumerated
  # exactly (no interpolation in the simulator).
  seed: 90001
  N: 1000000
  G_sim: 25
  G_ped: 12
  G_pheno: 10
  replicates: 1
  standardize: per_generation
  pedigree:
    p_mztwin: 0
    assort1: 0
    assort2: 0
    trait1:
      A: 0.5
      C: 0.0
      E: 0.5
    trait2:
      A: 0.5
      C: 0.0
      E: 0.5
    rA: 0.5
    rC: 0.0
    rE: 0.0
  phenotype:
    trait1:
      model: adult
      params:
        method: ltm
        cip_x0: 50
        cip_k: 0.15
        prevalence: {2: 0.02, 3: 0.03111111111111111, 4: 0.04222222222222222, 5: 0.05333333333333333, 6: 0.06444444444444444, 7: 0.07555555555555556, 8: 0.08666666666666667, 9: 0.09777777777777778, 10: 0.10888888888888888, 11: 0.12}
