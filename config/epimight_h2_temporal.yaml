        cip_x0: 50
        cip_k: 0.15
        prevalence: {2: 0.02, 3: 0.03111111111111111, 4: 0.04222222222222222, 5: 0.05333333333333333, 6: 0.06444444444444444, 7: 0.07555555555555556, 8: 0.08666666666666667, 9: 0.09777777777777778, 10: 0.10888888888888888, 11: 0.12}
  censoring:
    gen_censoring: {}
    death_scale: 1000000
    death_rho: 1.0
  analysis:
    skip_ne_coancestry: true


