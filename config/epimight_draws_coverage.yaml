# epimight_draws_coverage — frequentist CI-coverage experiment for EPIMIGHT h².
#
# Near-unbiased onset_censoring cells re-simulated up to R=200 times each, so the
# actual coverage of a 95% CI for liability h² can be measured across independent
# replicates. Originally built to study EPIMIGHT's draws (MI K), which EPIMIGHT
# 2.1.1 removed (fitACE_epimight ADR 0004); the cells now serve the
# fractional-estimator CI work (fitACE_epimight scripts/fractional_proto.py and
# scripts/fractional_coverage_fast.py). The folder keeps its name so existing
# results/epimight_draws_coverage/ outputs stay attached.
#
# Scenario params are copied verbatim from config/epimight_onset_censoring.yaml
# (the eoc_K01_x08_c80 and eoc_K25_x08_c80 blocks) so the DGP matches the sweep;
# only `replicates` (1 -> 200) and the seed base (fresh, clear of the sweep's
# 60000-60063) differ. The EPIMIGHT kind restriction is fitACE-side
# (fitACE/config/epimight_draws_coverage.yaml).

cov_K01_x08_c80:
  seed: 200000
  N: 250000
  G_sim: 12
  G_ped: 10
  G_pheno: 10
  replicates: 200
  pedigree:
    p_mztwin: 0
    trait1:
      A: 0.5
      C: 0.0
      E: 0.5
    trait2:
      A: 0.5
      C: 0.0
      E: 0.5
    rA: 0.0
    rC: 0.0
  phenotype:
    trait1:
      model: adult
      params:
        method: ltm
        cip_x0: 8
        cip_k: 0.15
        prevalence: 0.01
      beta: 1.0
      beta_sex: 0.0
    trait2:
      model: adult
      params:
        method: ltm
        cip_x0: 8
        cip_k: 0.15
        prevalence: 0.01
      beta: 1.0
      beta_sex: 0.0
  censoring:
    gen_censoring: {0: [0, 80], 1: [0, 80], 2: [0, 80], 3: [0, 80], 4: [0, 80], 5: [0, 80], 6: [0, 80], 7: [0, 80], 8: [0, 80], 9: [0, 80]}
    death_scale: 164
    death_rho: 2.73
