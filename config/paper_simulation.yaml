# ============================================================
# ACE Simulation Validation Study — Scenario Configuration
# Neurodevelopmental Disease Edition
# ============================================================
#
# Design constraints
# ------------------
# 1. All scenarios use G_sim: 12, G_ped: 10, G_pheno: 10,
#    producing 10 observable pedigree generations (0–9).
# 2. A single, fixed generational censoring schedule is applied
#    uniformly across ALL scenarios. Censoring parameters are
#    NEVER varied between scenarios.
# 3. Censoring schedule rationale:
#      Gen 0–2  : [80, 80]  fully observed (historical cohorts)
#      Gen 3    : [60, 80]  first reduction — gradual onset of
#      Gen 4    : [50, 80]  incomplete follow-up in progressively
#      Gen 5    : [40, 80]  more recent birth cohorts, reflecting
#      Gen 6    : [30, 80]  the shrinking observation window as
#      Gen 7    : [20, 80]  cohorts approach the present
#      Gen 8    : [10, 80]  near-contemporary cohort
#      Gen 9    : [0,  45]  most recent cohort, heavily truncated
#    The upper bound is held at 80 throughout; only the lower
#    bound (minimum observed age at study entry / left truncation
#    / calendar availability) decreases linearly. The apparent
#    compression of onset age across recent generations is
#    entirely a function of the hazard model and prevalence,
#    not of this window.
# 4. All variation across scenarios arises exclusively from
#    ACE variance components and phenotype model parameters.
# 5. Seeds are spaced by 1000 starting at 31000.
# ============================================================


# ── REFERENCE CENSORING SCHEDULE (reproduced verbatim in every
#    scenario for portability) ───────────────────────────────
#
#   censoring:
#     max_age: 80
#     gen_censoring:
#       0: [0, 80]   # fully observed — oldest historical cohort
#       1: [0, 80]   # fully observed
#       2: [0, 80]   # fully observed
#       3: [0, 70]   # gradual reduction of upper bound begins
#       4: [0, 60]   # progressively shorter follow-up window
#       5: [0, 50]   # in more recent birth cohorts, reflecting
#       6: [0, 40]   # the shrinking calendar time available
#       7: [0, 30]   # for observation as cohorts approach
#       8: [0, 20]   # the present
#       9: [0, 10]   # most recent cohort: only ~10 yr observed
#     death_scale: 164
#     death_rho: 2.73
# ──────────────────────────────────────────────────────────────


