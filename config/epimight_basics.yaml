# epimight_basics — two scenarios for testing the basics of EPIMIGHT.
#
# Both scenarios carry the same two traits, C = 0 throughout, and about 100K
# phenotyped individuals. Trait 1 is a high-h2, rare, late-onset trait; trait 2
# is a low-h2, common, early-onset trait; rA = 0.5 between them.
#
#   trait 1: A 0.7, K 0.02, median onset 50
#   trait 2: A 0.3, K 0.15, median onset 20
#
# eb_simple:    4 generations x 25K. No MZ twins, random mating, no death, every
#               generation observed over ages 0-80, sex-neutral prevalence.
# eb_realistic: 10 generations x 10K. MZ twins, assortative mating, competing-risk
#               mortality, a calendar-style censoring schedule that observes the
#               youngest cohort only to age 12, male K = 2 x female K at the same
#               lifetime mean, and 10% uniform dropout.

eb_simple:
  seed: 360000
  N: 25000
  G_sim: 7
  G_ped: 5
  G_pheno: 4
  replicates: 1
  pedigree:
    p_mztwin: 0
    assort1: 0
    assort2: 0
    trait1: {A: 0.7, C: 0.0, E: 0.3}
    trait2: {A: 0.3, C: 0.0, E: 0.7}
    rA: 0.5
    rC: 0.0
    rE: 0.0
  phenotype:
    trait1:
      model: adult
      params: {method: ltm, cip_x0: 50, cip_k: 0.15, prevalence: 0.02}
      beta: 1.0
      beta_sex: 0.0
    trait2:
      model: adult
      params: {method: ltm, cip_x0: 20, cip_k: 0.15, prevalence: 0.15}
      beta: 1.0
      beta_sex: 0.0
  censoring:
    gen_censoring: {0: [0, 80], 1: [0, 80], 2: [0, 80], 3: [0, 80], 4: [0, 80]}
    death_scale: 1000000
    death_rho: 1.0
  ascertainment:
    dropout_rate: 0

eb_realistic:
  seed: 370000
  N: 10000
  G_sim: 12
  G_ped: 10
  G_pheno: 10
  replicates: 1
  pedigree:
    p_mztwin: 0.02
    assort1: 0.3
    assort2: 0.15
    trait1: {A: 0.7, C: 0.0, E: 0.3}
    trait2: {A: 0.3, C: 0.0, E: 0.7}
    rA: 0.5
    rC: 0.0
    rE: 0.0
  phenotype:
    trait1:
      model: adult
      params:
        method: ltm
        cip_x0: 50
        cip_k: 0.15
        prevalence: {female: 0.0133, male: 0.0267}
      beta: 1.0
      beta_sex: 0.0
    trait2:
      model: adult
      params:
        method: ltm
        cip_x0: 20
        cip_k: 0.15
        prevalence: {female: 0.1, male: 0.2}
      beta: 1.0
      beta_sex: 0.0
  censoring:
    gen_censoring:
      0: [0, 80]
      1: [0, 80]
      2: [0, 80]
      3: [0, 70]
      4: [0, 60]
      5: [0, 50]
      6: [0, 40]
      7: [0, 30]
      8: [0, 20]
      9: [0, 12]
    death_scale: 164
    death_rho: 2.73
  ascertainment:
    dropout_rate: 0.1
