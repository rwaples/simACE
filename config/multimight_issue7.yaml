# rwaples/fitACE_epimight#7: fresh replication of avuncular_symmetry under C transmission,
# with a matched no-transmission control (plans/epimight-7-avuncular-symmetry.md).
# Cells i7_X copy multimight.yaml's mm_X except seed and replicates. Seeds 5000 apart, from 560000:
# a rep uses seed + rep - 1, and its streams sit at +100 and +1000 (see multimight.yaml).

i7_C02_bm:
  seed: 560000
  N: 50000
  G_sim: 10
  G_ped: 10
  G_pheno: 4
  replicates: 1000
  standardize: none
  pedigree:
    p_mztwin: 0
    trait1:
      A: 0.5
      C: 0.2
      E: 0.3
      C_transmission:
        maternal: 0.5
        paternal: 0.0
    trait2:
      A: 0.5
      C: 0.2
      E: 0.3
      C_transmission:
        maternal: 0.5
        paternal: 0.0
    rA: 0.0
    rC: 0.0
  phenotype:
    trait1:
      model: adult
      params:
        method: ltm
        cip_x0: 50
        cip_k: 0.15
        prevalence: 0.25
      beta: 1.0
      beta_sex: 0.0
    trait2:
      model: adult
      params:
        method: ltm
        cip_x0: 20
        cip_k: 0.15
        prevalence: 0.25
      beta: 1.0
      beta_sex: 0.0
  censoring:
    gen_censoring: {6: [0, 80], 7: [0, 80], 8: [0, 80], 9: [0, 80]}
    death_scale: 164
    death_rho: 2.73

