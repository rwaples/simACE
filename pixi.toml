# Canonical simACE environment (ADR 0016; sole environment since the conda
# retirement, ADR 0018): pixi runs every simACE-scoped command (pytest / ruff
# / ty / snakefmt / snakemake). Family work runs in fitACE/pixi.toml;
# editable pedigree-graph work in external/pedigree-graph/pixi.toml.
[workspace]
name = "simace"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = "3.13.*"
# core (numba caps numpy <2.5; bump both together — same note as environment.yml)
numpy = "2.4.*"
scipy = "1.18.*"
pandas = "3.0.*"
polars = "1.43.*"
pyarrow = "25.0.*"
pyyaml = "6.0.*"
numba = "0.66.*"
# plotting
matplotlib = "3.11.*"
seaborn = "0.13.*"
pillow = "12.3.*"
# workflow (snakemake-minimal, not the meta-package)
snakemake-minimal = "9.25.*"
snakemake-executor-plugin-slurm = "2.8.*"
snakefmt = "2.0.*"
# dev / test
pytest = "9.1.*"
pytest-xdist = "3.8.*"
ruff = "0.16.*"
# graphics
graphviz = "*"
# MKL / linear algebra
libopenblas = "*"
mkl = "*"
tbb = "*"
pip = "*"

[pypi-dependencies]
simace = { path = ".", editable = true, extras = ["dev"] }
# pedigree-graph resolves from PyPI (released wheel). For ad-hoc editable
# development against the umbrella checkout, add locally (do NOT commit):
#   pedigree-graph = { path = "external/pedigree-graph", editable = true }
# Routine editable pedigree-graph work belongs in its own manifest,
# external/pedigree-graph/pixi.toml (ADR 0018).

# `pixi run test` is the parallel suite: 6 worker processes, each pinned to a
# single numba/BLAS/polars thread, for a total budget of 6 of the 12 cores.
# The pins live here rather than in [activation.env] on purpose -- the pipeline
# rules depend on numba's `parallel=True` kernels (simace/phenotype/hazards.py)
# and on threaded BLAS, so pinning globally would slow every `pixi run
# snakemake`.  Bare `pixi run pytest` stays serial and unpinned so that -v
# output, --pdb, and single-module runs behave the way CLAUDE.md documents.
# Worker count and dist mode chosen by tools/bench_pytest_workers.sh.
# worksteal, not loadscope: loadscope commits each scope to a worker up front
# and never revisits it, so the worker that drew the 63s Monte Carlo test ran
# to 138s while the other five idled from ~78s.  Measured on this box at 6x1:
# loadscope 157.7s (1.83x per-worker spread), load 137.7s (1.56x),
# worksteal 115.3s (1.08x).  Scope grouping was worth only ~1.3s of saved
# fixture setup, against 42s of imbalance.
[tasks.test]
description = "Full pytest suite on 6 xdist workers, one numba/BLAS thread each"
cmd = "pytest -n 6 --dist worksteal"
env = { OMP_NUM_THREADS = "1", MKL_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", NUMEXPR_NUM_THREADS = "1", NUMBA_NUM_THREADS = "1", POLARS_MAX_THREADS = "1" }

[activation.env]
MPLBACKEND = "Agg"
