# Canonical simACE environment (ADR 0016; sole environment since the conda
# retirement, ADR 0018): pixi runs every simACE-scoped command (pytest / ruff
# / ty / snakefmt / snakemake). Family work runs in fitACE/pixi.toml;
# editable pedigree-graph work in external/pedigree-graph/pixi.toml.
[workspace]
name = "simace"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = "3.13.*"
# core (numba caps numpy <2.5; bump both together — same note as environment.yml)
numpy = "2.4.*"
scipy = "1.18.*"
pandas = "3.0.*"
polars = "1.43.*"
pyarrow = "25.0.*"
pyyaml = "6.0.*"
numba = "0.66.*"
# plotting
matplotlib = "3.11.*"
seaborn = "0.13.*"
pillow = "12.3.*"
# workflow (snakemake-minimal, not the meta-package)
snakemake-minimal = "9.25.*"
snakemake-executor-plugin-slurm = "2.8.*"
snakefmt = "2.0.*"
# dev / test
pytest = "9.1.*"
ruff = "0.16.*"
# graphics
graphviz = "*"
# MKL / linear algebra
libopenblas = "*"
mkl = "*"
tbb = "*"
pip = "*"

[pypi-dependencies]
simace = { path = ".", editable = true, extras = ["dev"] }
# pedigree-graph resolves from PyPI (released wheel). For ad-hoc editable
# development against the umbrella checkout, add locally (do NOT commit):
#   pedigree-graph = { path = "external/pedigree-graph", editable = true }
# Routine editable pedigree-graph work belongs in the conda family env
# (compat-mode install, see RELEASE.md step 2).

[activation.env]
MPLBACKEND = "Agg"
