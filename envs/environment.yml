name: simACE
channels:
  - nodefaults
  - conda-forge
  - bioconda
dependencies:
  - python=3.13.*
  # core
  - numpy=2.4.*
  - scipy=1.17.*
  # Snakemake/eido and the SLURM executor plugin currently require pandas <3.
  - pandas=2.3.*
  - pyarrow=23.0.*
  - pyyaml=6.0.*
  - numba=0.65.*
  # plotting
  - matplotlib=3.10.*
  - seaborn=0.13.*
  - pillow=12.2.*
  # workflow
  - snakemake=9.20.*
#  - snakemake-executor-plugin-slurm=2.6.*
#  - snakefmt=1.1.*
  # dev / test
  - pytest=9.0.*
  - ruff=0.15.*
  # graphics
  - graphviz
  # MKL / linear algebra
  - libopenblas
  - mkl
  - tbb

  # system
  - pip
  # optional: for generating methods.pdf
  # - pandoc
  # - tectonic
  - pip:
      - "-e ..[dev]"
  # For combined simACE + fitACE dev, layer in the private sister repo
  # (requires the ../fitACE checkout) after creating this env:
  #   conda env update -n simACE -f envs/environment-fitace.yml
variables:
  MPLBACKEND: Agg
