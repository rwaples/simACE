name: simACE
channels:
  - nodefaults
  - conda-forge
  - bioconda
dependencies:
  - python=3.13.*
  # core
  # numba caps numpy <2.5 (still true as of numba 0.66), so numpy stays on 2.4.x
  # even though 2.5.x is released. Bump both together once numba lifts the cap.
  - numpy=2.4.*
  - scipy=1.18.*
  - pandas=3.0.*
  - polars=1.43.*
  - pyarrow=25.0.*
  - pyyaml=6.0.*
  - numba=0.66.*
  # plotting
  - matplotlib=3.11.*
  - seaborn=0.13.*
  - pillow=12.3.*
  # workflow
  # snakemake-minimal, not the `snakemake` meta-package. The meta owns zero
  # files and declares `pandas <3` directly in its own bioconda recipe, so it
  # is the only thing blocking pandas 3; snakemake-minimal ships the CLI and
  # core and has no pandas dependency. The meta's other extras are unused here:
  # eido/peppy (PEP `pepfile:` support — imported lazily, and no pepfile exists
  # in this workflow), pygments (HTML report highlighting), slack_sdk.
  - snakemake-minimal=9.25.*
  - snakemake-executor-plugin-slurm=2.8.*
  - snakefmt=2.0.*
  # dev / test
  - pytest=9.1.*
  - ruff=0.16.*
  # graphics
  - graphviz
  # MKL / linear algebra
  - libopenblas
  - mkl
  - tbb

  # system
  - pip
  # optional: for generating methods.pdf
  # - pandoc
  # - tectonic
  - pip:
      - "-e ..[dev]"
  # For combined simACE + fitACE dev, layer in the private sister repo
  # (requires the ../fitACE checkout) after creating this env:
  #   conda env update -n simACE -f envs/environment-fitace.yml
variables:
  MPLBACKEND: Agg
