name: simACE
channels:
  - nodefaults
  - conda-forge
  - bioconda
dependencies:
  - python=3.13.*
  # core
  - numpy
  - scipy
  # The old upstream blockers are gone (eido >=0.2.6 and
  # snakemake-executor-plugin-slurm >=2.8.0 both allow pandas 3). This cap now
  # just mirrors our own `pandas>=2.2,<3` in the family pyprojects, pending a
  # validation pass across simACE + fitACE.
  - pandas>=2.2,<3
  - pyarrow
  - pyyaml
  - numba
  # plotting
  - matplotlib
  - seaborn
  - pillow
  # workflow
  - snakemake
  - snakemake-executor-plugin-slurm
  - snakefmt
  # dev / test
  - pytest
  - ruff
  # graphics
  - graphviz
  # MKL / linear algebra
  - libopenblas
  - mkl
  - tbb

  # system
  - pip
  # optional: for generating methods.pdf
  # - pandoc
  # - tectonic
  - pip:
      - "-e ..[dev]"
  # For combined simACE + fitACE dev, layer in the private sister repo
  # (requires the ../fitACE checkout) after creating this env:
  #   conda env update -n simACE -f envs/environment-fitace.yml
variables:
  MPLBACKEND: Agg
