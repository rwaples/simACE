name: simACE
channels:
  - nodefaults
  - conda-forge
  - bioconda
dependencies:
  - python=3.13.*
  # core
  - numpy
  - scipy
  - pandas>=3,<4
  - pyarrow
  - pyyaml
  - numba
  # plotting
  - matplotlib
  - seaborn
  - pillow
  # workflow
  # snakemake-minimal, not the `snakemake` meta-package — the meta caps
  # pandas <3 in its own recipe and owns zero files. See envs/environment.yml.
  - snakemake-minimal
  - snakemake-executor-plugin-slurm
  - snakefmt
  # dev / test
  - pytest
  - ruff
  # graphics
  - graphviz
  # MKL / linear algebra
  - libopenblas
  - mkl
  - tbb

  # system
  - pip
  # optional: for generating methods.pdf
  # - pandoc
  # - tectonic
  - pip:
      - "-e ..[dev]"
  # For combined simACE + fitACE dev, layer in the private sister repo
  # (requires the ../fitACE checkout) after creating this env:
  #   conda env update -n simACE -f envs/environment-fitace.yml
variables:
  MPLBACKEND: Agg
